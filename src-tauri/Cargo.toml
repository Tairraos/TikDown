[package]
name = "tikdown"
version = "2.2.7"
description = "多平台社媒视频下载器，只下载视频"
edition = "2021"
rust-version = "1.84"

# 二进制与库同名会让 main.rs 里的 crate 引用指向自己，这里显式区分。
# Tauri 约定：库名 + _lib 作为库 crate 名。
[lib]
name = "tikdown_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# protocol-asset：本地视频预览与缩略图靠 asset:// 直读磁盘文件（TD-FE-024/025）。
# 该协议支持 Range/206，进度条拖动由上游实现，不需要自建流式服务。
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
which = "7"
ureq = "2"
tokio = { version = "1.53.2", features = ["rt", "sync"] }
tauri-plugin-clipboard-manager = "2.3.3"
fs4 = "1.1.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
